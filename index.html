<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مجسم المدرسة ثلاثي الأبعاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
--bg:#f4f1ea; --panel:#ffffff; --ink:#1d2b2f; --muted:#5d6b70; --line:#e2ddd0;
--accent:#e4572e; --accent-ink:#fff; --chip:#efeadd;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#12181a; --panel:#1b2427; --ink:#eef2f1; --muted:#9db0b5; --line:#2c393d;
--accent:#ff7a4d; --accent-ink:#1a0d07; --chip:#25323640;
}
}
:root[data-theme="dark"]{
--bg:#12181a; --panel:#1b2427; --ink:#eef2f1; --muted:#9db0b5; --line:#2c393d;
--accent:#ff7a4d; --accent-ink:#1a0d07; --chip:#253236;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif}
#app{display:grid;grid-template-columns:340px 1fr;height:100vh;height:100dvh}
#side{background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:5}
#side header{padding:16px 16px 10px}
h1{font-size:19px;margin:0 0 2px;font-weight:800}
.sub{font-size:12.5px;color:var(--muted);margin:0}
.bar{padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:6px}
button{font-family:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 11px;border-radius:9px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sec{font-size:12px;color:var(--muted);padding:6px 16px 4px;font-weight:700;letter-spacing:.2px}
#list{overflow:auto;padding:4px 10px 14px;flex:1;min-height:0}
.stop{display:flex;gap:10px;align-items:center;width:100%;text-align:right;border:0;background:transparent;color:var(--ink);padding:7px 8px;border-radius:10px;font-size:14px;font-weight:600}
.stop:hover,.stop.cur{background:var(--chip)}
.stop .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:800}
.stop small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.tag{font-size:10.5px;color:#8a5a00;background:#ffe9b8;border-radius:6px;padding:1px 6px;margin-inline-start:6px;font-weight:700}
#legend{display:flex;flex-wrap:wrap;gap:8px 12px;padding:8px 16px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
#legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
#stage{position:relative;min-width:0;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse at center,transparent 55%,rgba(20,14,6,.38) 100%)}
#hud{position:absolute;inset-inline:12px;top:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#now{pointer-events:auto;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;font-size:15px;box-shadow:0 4px 18px #0002}
#now small{display:block;font-weight:500;color:var(--muted);font-size:12px}
#nav{position:absolute;bottom:14px;inset-inline:0;display:flex;justify-content:center;gap:8px;pointer-events:none}
#nav .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#nav .btn{pointer-events:auto;background:var(--panel);box-shadow:0 4px 14px #0003;font-size:14px;padding:9px 16px}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;font-weight:700}
@media (max-width:820px){
#app{grid-template-columns:1fr;grid-template-rows:1fr 42%}
#side{order:2;border-inline-end:0;border-top:1px solid var(--line)}
#stage{order:1}
header{padding:10px 14px 6px!important}
.sub{display:none}
#legend{display:none}
}
</style>
</head>

<h1>المدرسة المحمدية — مجسم ثلاثي الأبعاد</h1>

</header>
<div class="bar" id="modes"></div>

<div class="sec">محطات الجولة</div>

<canvas id="c"></canvas>

<button class="btn" id="prev">◀ السابق</button>
<button class="btn" id="play">▶ جولة تلقائية</button>
<button class="btn" id="next">التالي ▶</button>
</div>
<div id="loading">جارٍ تحميل المجسم…</div>
</main>
</div>

G.badge.visible=toggles.route.on&&!upper;G.route.visible=toggles.route.on&&!upper;
G.badge1.visible=toggles.route.on&&upper;G.route1.visible=toggles.route.on&&upper;
G.evac0.visible=toggles.safety.on;G.evac1.visible=toggles.safety.on&&!ground;
}
const modesEl=document.getElementById('modes');
[['ground','الدور الأرضي'],['upper','الدور الأول'],['full','مع الأسقف']].forEach(([k,t])=>{
const b=document.createElement('button');b.className='btn';b.dataset.m=k;b.textContent=t;b.onclick=()=>{setMode(k);};modesEl.appendChild(b);});
const toggles={labels:{on:true},route:{on:true},outer:{on:true},safety:{on:true}};
const togEl=document.getElementById('toggles');
{const vg=document.createElement('div');vg.id='vig';stage.appendChild(vg);
const setPhoto=on=>{sun.color.set(on?0xffddb0:0xffe9c4);sun.intensity=on?.95:.8;if(on)sun.position.set(-95,72,85);else sun.position.set(-70,110,60);
hemi.intensity=on?.34:.38;cv.style.filter=on?'contrast(1.06) saturate(.94)':'';vg.style.opacity=on?1:0;};
const b=document.createElement('button');b.className='btn';b.textContent='📷 تصوير واقعي';let on=false;
b.onclick=()=>{on=!on;b.classList.toggle('on',on);setPhoto(on);};togEl.appendChild(b);on=true;b.classList.add('on');setPhoto(true);}
[['labels','الأسماء'],['route','مسار الجولة'],['outer','أسماء الخارج'],['safety','الإخلاء والسلامة']].forEach(([k,t])=>{
const b=document.createElement('button');b.className='btn on';b.textContent=t;
b.onclick=()=>{toggles[k].on=!toggles[k].on;b.classList.toggle('on',toggles[k].on);if(k==='outer')G.labOut.visible=toggles[k].on;setMode(mode);};togEl.appendChild(b);});
[['top','منظر علوي'],['aerial','منظر جوي']].forEach(([k,t])=>{
const b=document.createElement('button');b.className='btn';b.textContent=t;b.onclick=()=>{curIdx=-1;markCur();fly(k==='top'?{cam:[0,118,-4],look:[0,0,-6]}:{cam:[-8,84,120],look:[0,0,-8]},'المنظر '+(k==='top'?'العلوي':'الجوي'),'اسحب للتدوير');};togEl.appendChild(b);});
const listEl=document.getElementById('list');
stops.forEach((s,i)=>{if(s.sec)listEl.insertAdjacentHTML('beforeend','<div class="sec">'+s.sec+'</div>');const b=document.createElement('button');b.className='stop';
b.innerHTML=`<span class="n">${AR(i+1)}</span><span>${s.name}${s.verify?'<span class="tag">للتأكيد</span>':''}${s.sub?`<small>${s.sub}</small>`:''}</span>`;
b.onclick=()=>{stopTour();go(i);};listEl.appendChild(b);s.btn=b;});
let fl=null;
function fly(t,title,sub,dur=1800){
fl={t0:performance.now(),dur,p0:camera.position.clone(),l0:controls.target.clone(),p1:new THREE.Vector3(...t.cam),l1:new THREE.Vector3(...t.look)};
document.getElementById('now').innerHTML=`${title}<small>${sub||''}</small>`;
}
let curIdx=-1;
function markCur(){stops.forEach((s,i)=>s.btn.classList.toggle('cur',i===curIdx));}
function go(i){
i=(i+stops.length)%stops.length;curIdx=i;const s=stops[i];
if(s.mode)setMode(s.mode);else if(mode==='upper'||mode==='full')setMode('ground');
markCur();s.btn.scrollIntoView({block:'nearest',behavior:'smooth'});
fly(s,`${AR(i+1)}. ${s.name}`,s.sub||'');
}
document.getElementById('prev').onclick=()=>{stopTour();go(curIdx<0?0:curIdx-1);};
document.getElementById('next').onclick=()=>{stopTour();go(curIdx+1);};
let tour=null;const playB=document.getElementById('play');
function stopTour(){if(tour){clearInterval(tour);tour=null;}playB.classList.remove('on');playB.textContent='▶ جولة تلقائية';}
playB.onclick=()=>{if(tour){stopTour();return;}playB.classList.add('on');playB.textContent='⏸ إيقاف الجولة';go(curIdx+1);tour=setInterval(()=>go(curIdx+1),4600);};
cv.addEventListener('pointerdown',()=>{fl=null;});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
camera.position.set(-8,84,120);controls.target.set(0,0,-8);
setMode('ground');
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(){
if(fl){const k=Math.min(1,(performance.now()-fl.t0)/fl.dur),e=ease(k);
camera.position.lerpVectors(fl.p0,fl.p1,e);controls.target.lerpVectors(fl.l0,fl.l1,e);if(k>=1)fl=null;}
controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);
}
loop();
document.getElementById('loading').style.display='none';
window.__school={go,setMode,stops,rooms,camera,controls,scene,renderer};
window.__ready=true;
})();
</script>
